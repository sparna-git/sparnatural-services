log:
  directory: ./logs
projects:
  dbpedia-en:
    shacl: ./config/dbpedia-en/config.ttl
    sparqlEndpoint: https://dbpedia.org/sparql
    domains:
      - sparna-git.github.io
    cache:
      urilookup: ./cache/dbpedia-en/urilookup_cache.json
    reconciliation:
      implementation: SparqlReconcileServiceV13
      cacheSize: 1000
      maxResults: 2
    text2query:
      implementation: MistralText2QueryService
      agentId: ag_019c8a5149a076f48d90b303514760d6
    query2text:
      implementation: MistralQuery2TextService
      agentId: ag_019c8b1bad56750d95e1b91e7d2a8ce8
    t2qPromptGenerator:
      implementation: T2QPromptGenerator
      additionalInstructions: ./config/dbpedia-en/additionalInstructions.txt
    q2tPromptGenerator:
      implementation: Q2TPromptGenerator
  demo-ep:
    shacl: ./config/demo-ep/config-1.ttl ./config/demo-ep/config-2.ttl
    sparqlEndpoint: http://graphdb.sparna.fr/repositories/endorse2025
    domains:
      - sparna-git.github.io
    cache:
      urilookup: ./cache/demo-ep/urilookup_cache.json
    reconciliation:
      implementation: SparqlReconcileService
      cacheSize: 1000
      maxResults: 2
    text2query:
      implementation: MistralText2QueryService
      agentId: ag:33fd9714:20251002:t2q-org-ep:e1a9d878
    query2text:
      implementation: MistralQuery2TextService
      agentId: ag:33fd9714:20250507:untitled-agent:d1fc8155
    t2qPromptGenerator:
      implementation: T2QPromptGenerator
      additionalInstructions: ./config/demo-ep/additionalInstructions.txt
    q2tPromptGenerator:
      implementation: Q2TPromptGenerator
  ruim:
    shacl: ./config/ruim/sparnatural-config.ttl
    sparqlEndpoint: https://data.sparna.fr/graphdb/repositories/RUIM
    shaclTypes:
      - http://data.esante.gouv.fr/ansm/medicament/Presentation
      - http://data.esante.gouv.fr/ansm/medicament/UniteCommuneDeDispensation
      - http://data.esante.gouv.fr/ansm/medicament/SpecialitePharmaceutique
      - http://data.esante.gouv.fr/ansm/medicament/Evenement
      - http://data.esante.gouv.fr/ansm/medicament/Substance
      - http://data.esante.gouv.fr/ansm/medicament/GroupeGenerique
      - http://data.esante.gouv.fr/ansm/medicament/Organisation
      - http://data.esante.gouv.fr/ansm/medicament/ElementPresentation
      - http://data.esante.gouv.fr/ansm/medicament/TypeEvenement
      - http://data.esante.gouv.fr/ansm/medicament/TypeProcedure
      - http://data.esante.gouv.fr/ansm/medicament/StatutSpecialite
      - http://data.esante.gouv.fr/ansm/medicament/NiveauPrescriptibilite
      - http://data.esante.gouv.fr/ansm/medicament/JustificationNiveauPrescriptibilite
      - http://data.esante.gouv.fr/ansm/medicament/Voie
      - http://data.esante.gouv.fr/ema/sms
    domains:
      - sparna-git.github.io
    cache:
      urilookup: ./cache/ruim/urilookup_cache.json
    text2query:
      implementation: MistralText2QueryService
      agentId: ag_019dbabf106875a7a0a8904017d7e93f
    query2text:
      implementation: MistralQuery2TextService
      agentId: ag_019cdc2f1d59758e84c7ff1de49a15c6
    t2qPromptGenerator:
      implementation: T2QPromptGenerator
      additionalInstructions: ./config/ruim/additionalInstructions.txt
    q2tPromptGenerator:
      implementation: Q2TPromptGenerator
    reconciliation:
      - implementation: LuceneGraphDBReconcileService
      - implementation: LunrReconcileService
        cacheSize: 1000
        maxResults: 10
        indexCachePath: ./cache/ruim/lunr-index-ruim.json
        sparqlQueries:
          - field: label
            boost: 10
            queryFiles:
              - ./config/ruim/sparqlqueriesindex/label_rdfs.rq
              - ./config/ruim/sparqlqueriesindex/label_atc.rq
          - field: altLabel
            boost: 5
            queryFile: ./config/ruim/sparqlqueriesindex/altlabel_skos.rq
  isidore:
    shacl: ./config/isidore/isidore-shapes.ttl
    sparqlEndpoint: https://isidore-ref.huma-num.fr/sparql
    shaclTypes:
      - http://isidore.science/class/Source
      - http://www.w3.org/2004/02/skos/core#Concept
      - http://isidore.science/class/Organization
      - http://isidore.science/class/Document
      - http://data.bnf.fr/ontology/bnf-onto/ExpositionVirtuelle
      - http://xmlns.com/foaf/0.1/Agent
      - http://isidore.science/class/Collection
    domains:
      - sparna-git.github.io
    cache:
      urilookup: ./cache/isidore/urilookup_cache.json
    reconciliation:
      - implementation: IsidoreApiReconcileService
      - implementation: SparqlReconcileService
        cacheSize: 500
        maxResults: 4
  ruim-mcp:
    shacl: ./config/ruim/RUIM-SHACL-instances.ttl
    sparqlEndpoint: https://data.sparna.fr/graphdb/repositories/RUIM
    fewShotsFile: ./config/ruim/few-shots.json
    useCases:
      - title: "Correspondances CIP/UCD par ATC"
        entryPoint: "`SpecialitePharmaceutique` filtré sur `med:codeATC`"
        joins: "-> `Presentation` -> `UCD`"
      - title: "Spécialités par substance active"
        entryPoint: "`Substance` réconciliée -> `med:estSubstanceActiveDans`"
        joins: "-> `SpecialitePharmaceutique`"
      - title: "Génériques d'une spécialité"
        entryPoint: "`GroupeGenerique` avec `med:specialiteDeReference`"
        joins: "-> `med:specialiteGenerique`"
      - title: "Présentations actives d'un laboratoire"
        entryPoint: "`Organisation` réconciliée -> `med:titulaireCourant`"
        joins: "-> `SpecialitePharmaceutique` -> `Presentation`"
      - title: "Toutes les spécialités d'une forme"
        entryPoint: "`Forme` filtrée sur libellé -> `med:formeManufacturee`"
        joins: "<- `SpecialitePharmaceutique`"
      - title: "Composition d'une spécialité"
        entryPoint: "`SpecialitePharmaceutique` filtrée sur libellé -> `med:seComposeDe`"
        joins: "<- `Element` -> `med:substanceActive`|`med:fractionTherapeutique` (composition formelle) + <- `Element` -> `med:expressionDeDosage` (composition textuelle)"
    terminology:
      - user: "Code CIS"
        domain: "Identifiant de spécialité"
        sparql: "`med:CIS`"
      - user: "Code CIP / code-barres"
        domain: "Présentation"
        sparql: "`med:CIP13`, `med:CIP7`"
      - user: "Code UCD"
        domain: "Unité commune de dispensation"
        sparql: "`med:codeUCD13`, `med:codeUCD7`"
      - user: "Code ATC"
        domain: "Classification anatomique"
        sparql: "`med:codeATC` (littéral), `med:classificationATC` (URI)"
      - user: "Princeps"
        domain: "Spécialité de référence"
        sparql: "`med:specialiteDeReference` dans `med:GroupeGenerique`"
      - user: "Générique"
        domain: "Spécialité générique"
        sparql: "`med:specialiteGenerique` dans `med:GroupeGenerique`"
      - user: "Laboratoire / titulaire"
        domain: "Organisation"
        sparql: "`med:titulaireCourant` -> `med:Organisation`"
      - user: "Forme galénique"
        domain: "Forme manufacturée"
        sparql: "`med:formeManufacturee` -> `med:Forme`"
      - user: "Voie d'administration"
        domain: "Voie"
        sparql: "`med:voie` -> `med:Voie`"
      - user: "Substance active"
        domain: "Substance"
        sparql: "`med:substanceActive` -> `med:Substance`"
      - user: "Statut AMM"
        domain: "Statut courant"
        sparql: "`med:statutCourant` -> `med:StatutSpecialite`"
    shaclTypes:
      - http://data.esante.gouv.fr/ansm/medicament/SpecialitePharmaceutique
      - http://data.esante.gouv.fr/ansm/medicament/Presentation
      - http://data.esante.gouv.fr/ansm/medicament/UniteCommuneDeDispensation
      - http://data.esante.gouv.fr/ansm/medicament/GroupeGenerique
      - http://data.esante.gouv.fr/ansm/medicament/Element
      - http://data.esante.gouv.fr/ansm/medicament/ElementPresentation
      - http://data.esante.gouv.fr/ansm/medicament/DosageConcentration
      - http://data.esante.gouv.fr/ansm/medicament/DosagePresentation
      - http://data.esante.gouv.fr/ansm/medicament/Unite
      - http://data.esante.gouv.fr/ansm/medicament/ExpressionDeDosage
      - http://data.esante.gouv.fr/ansm/medicament/Organisation
      - http://data.esante.gouv.fr/ansm/medicament/Substance
      - http://data.esante.gouv.fr/ansm/medicament/Voie
      - http://data.esante.gouv.fr/ansm/medicament/Forme
      - http://data.esante.gouv.fr/ansm/medicament/UniteDePresentation
      - http://data.esante.gouv.fr/ansm/medicament/TypeContenant
      - http://data.esante.gouv.fr/ansm/medicament/JustificationNiveauVirtualisation
      - http://data.esante.gouv.fr/ansm/medicament/JustificationNiveauPrescriptibilite
      - http://data.esante.gouv.fr/ansm/medicament/NiveauVirtualisation
      - http://data.esante.gouv.fr/ansm/medicament/NiveauPrescriptibilite
      - http://data.esante.gouv.fr/ansm/medicament/TypeDose
      - http://data.esante.gouv.fr/ansm/medicament/Gamme
      - http://data.esante.gouv.fr/ansm/medicament/PrescriptionEnDC
      - http://data.esante.gouv.fr/ansm/medicament/PPhParSubstance
      - http://data.esante.gouv.fr/ansm/medicament/PPhParSubstanceDosage
      - http://data.esante.gouv.fr/ansm/medicament/PPhParSubstanceForme
      - http://data.esante.gouv.fr/ansm/medicament/PPhParSubstanceDosageForme
      - http://data.esante.gouv.fr/ansm/medicament/Evenement
      - http://data.esante.gouv.fr/ansm/medicament/Autorisation
      - http://data.esante.gouv.fr/ansm/medicament/ChangementDeStatut
      - http://data.esante.gouv.fr/ansm/medicament/TypeProcedure
      - http://data.esante.gouv.fr/ansm/medicament/StatutSpecialite
      - http://data.esante.gouv.fr/ansm/medicament/TypeEvenement
      - http://data.esante.gouv.fr/ema/sms
    domains:
      - sparna-git.github.io
    cache:
      urilookup: ./cache/ruim/urilookup_cache.json
    reconciliation:
      implementation: LunrReconcileService
      cacheSize: 1000
      maxResults: 6
      indexCachePath: ./cache/ruim/lunr-index-ruim.json
      sparqlQueries:
        - field: label
          boost: 10
          queryFiles:
            - ./config/ruim/sparqlqueriesindex/label_rdfs.rq
            - ./config/ruim/sparqlqueriesindex/label_atc.rq
        - field: altLabel
          boost: 5
          queryFile: ./config/ruim/sparqlqueriesindex/altlabel_skos.rq
    t2qPromptGenerator:
      implementation: T2QPromptGenerator
      additionalInstructions: ./config/ruim/additionalInstructions.txt
    q2tPromptGenerator:
      implementation: Q2TPromptGenerator
